name: Patch beige nook

on:
  push:
    paths:
      - .github/workflows/patch-beige-nook.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature
        uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - name: Furnish beige nook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/landing/components/StudioScene.tsx")
          text = path.read_text()

          component_anchor = "function DeskLamp() {"
          component = '''function FloorBookStack() {
            return (
              <group position={[2.16, 0.38, 2.5]} rotation={[0, -0.16, 0]}>
                <Box
                  position={[0, 0, 0]}
                  scale={[0.78, 0.12, 0.5]}
                  color="#8d9c87"
                  radius={0.025}
                />
                <Box
                  position={[0.04, 0.11, 0]}
                  scale={[0.7, 0.1, 0.46]}
                  rotation={[0, 0.18, 0]}
                  color="#d2b26f"
                  radius={0.022}
                />
                <Box
                  position={[-0.02, 0.205, 0]}
                  scale={[0.62, 0.09, 0.42]}
                  rotation={[0, -0.12, 0]}
                  color="#b97868"
                  radius={0.02}
                />
              </group>
            );
          }

          function DeskLamp() {'''

          if component_anchor not in text:
              raise SystemExit("DeskLamp anchor not found")
          text = text.replace(component_anchor, component, 1)

          plant_anchor = '      <Plant position={[-1.42, 0.84, -2.72]} scale={0.78} />'
          furnished = '''      <Plant position={[-1.42, 0.84, -2.72]} scale={0.78} />
                <FloorBookStack />
                <Plant position={[3.22, 0.56, 2.62]} scale={0.68} />'''

          if plant_anchor not in text:
              raise SystemExit("green plant anchor not found")
          text = text.replace(plant_anchor, furnished, 1)

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/landing/components/StudioScene.tsx
          git commit -m "Furnish front beige nook"
          git push origin HEAD:feature
