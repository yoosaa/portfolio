name: Patch orange area

on:
  push:
    paths:
      - .github/workflows/patch-orange-area.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature
        uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - name: Recompose orange area
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          scene_path = Path("src/features/landing/components/StudioScene.tsx")
          scene = scene_path.read_text()

          replacements = [
              (
                  '      position={[2.7, 2.65, -3.78]}',
                  '      position={[2.15, 2.65, -3.78]}',
              ),
              (
                  '''function Window({ onOpen }: { onOpen: () => void }) {''',
                  '''function PendantLamp() {
            return (
              <group position={[3.35, 3.68, -2.82]}>
                <mesh position={[0, -0.58, 0]} castShadow>
                  <cylinderGeometry args={[0.035, 0.035, 1.16, 10]} />
                  <meshStandardMaterial color="#6d6258" roughness={0.86} />
                </mesh>
                <mesh position={[0, -1.25, 0]} rotation={[0, 0, Math.PI]} castShadow>
                  <coneGeometry args={[0.4, 0.48, 18, 1, true]} />
                  <meshStandardMaterial
                    color="#9f8170"
                    roughness={0.92}
                    side={THREE.DoubleSide}
                  />
                </mesh>
                <mesh position={[0, -1.14, 0]}>
                  <sphereGeometry args={[0.11, 12, 8]} />
                  <meshStandardMaterial
                    color="#fff0c7"
                    emissive="#f5cd85"
                    emissiveIntensity={1.2}
                    toneMapped={false}
                  />
                </mesh>
                <pointLight
                  position={[0, -1.18, 0.18]}
                  color="#f3d19a"
                  intensity={1.4}
                  distance={3.2}
                  decay={2}
                />
              </group>
            );
          }

          function Window({ onOpen }: { onOpen: () => void }) {''',
              ),
              (
                  '      <Corkboard onOpen={onOpenCorkboard} />',
                  '''      <Corkboard onOpen={onOpenCorkboard} />
                <PendantLamp />''',
              ),
          ]

          for old, new in replacements:
              if old not in scene:
                  raise SystemExit(f"scene target not found: {old}")
              scene = scene.replace(old, new, 1)

          scene_path.write_text(scene)

          config_path = Path("src/features/landing/model/scene-config.ts")
          config = config_path.read_text()
          config_replacements = [
              (
                  'export const CORKBOARD_CAMERA_POSITION = new THREE.Vector3(2.7, 2.65, -2.02);',
                  'export const CORKBOARD_CAMERA_POSITION = new THREE.Vector3(2.15, 2.65, -2.02);',
              ),
              (
                  'export const CORKBOARD_LOOK_AT = new THREE.Vector3(2.7, 2.65, -3.93);',
                  'export const CORKBOARD_LOOK_AT = new THREE.Vector3(2.15, 2.65, -3.93);',
              ),
          ]

          for old, new in config_replacements:
              if old not in config:
                  raise SystemExit(f"config target not found: {old}")
              config = config.replace(old, new, 1)

          config_path.write_text(config)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/landing/components/StudioScene.tsx src/features/landing/model/scene-config.ts
          git commit -m "Recompose orange corkboard area"
          git push origin HEAD:feature
