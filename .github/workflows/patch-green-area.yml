name: Patch green area

on:
  push:
    paths:
      - .github/workflows/patch-green-area.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature
        uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - name: Recompose green area
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/landing/components/StudioScene.tsx")
          text = path.read_text()

          replacements = [
              (
                  '      position={[-2.55, 0.5, -3.12]}',
                  '      position={[-2.9, 0.5, -3.18]}',
              ),
              (
                  'function Plant() {',
                  '''function Plant({
            position,
            scale = 1,
          }: {
            position: [number, number, number];
            scale?: number;
          }) {''',
              ),
              (
                  '      position={[-2.9, 0.45, 2.42]}',
                  '''      position={position}
                scale={scale}''',
              ),
              (
                  '      <Plant />',
                  '      <Plant position={[-1.42, 0.84, -2.72]} scale={0.78} />',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"target not found: {old}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/landing/components/StudioScene.tsx
          git commit -m "Recompose green bookshelf area"
          git push origin HEAD:feature
