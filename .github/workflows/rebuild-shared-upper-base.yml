name: Rebuild shared upper base

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.event.issue.title == '[automation] rebuild shared upper base'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature
        uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - name: Replace separate pedestals with one shared base
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/landing/components/StudioScene.tsx")
          text = path.read_text()
          old = '''      <SolidBox
        position={[-2.5, 0.2, -2.58]}
        scale={[3.2, 0.46, 2.7]}
        color="#d8c3a2"
      />
      <SolidBox
        position={[-2.5, 0.49, -2.58]}
        scale={[2.96, 0.12, 2.3]}
        color="#7da28b"
      />

      <SolidBox
        position={[2.68, 0.2, -2.58]}
        scale={[2.5, 0.46, 2.3]}
        color="#d8c3a2"
      />
      <SolidBox
        position={[2.68, 0.49, -2.58]}
        scale={[2.18, 0.12, 1.96]}
        color="#d97d68"
      />'''
          new = '''      <SolidBox
        position={[-0.08, 0.2, -2.58]}
        scale={[8.02, 0.46, 2.7]}
        color="#d8c3a2"
      />
      <SolidBox
        position={[-2.5, 0.49, -2.58]}
        scale={[2.96, 0.12, 2.3]}
        color="#7da28b"
      />
      <SolidBox
        position={[2.68, 0.49, -2.58]}
        scale={[2.18, 0.12, 1.96]}
        color="#d97d68"
      />'''

          if old not in text:
              raise SystemExit("upper platform block was not found")

          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/landing/components/StudioScene.tsx
          git commit -m "Build shared beige upper base"
          git push origin HEAD:feature

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --reason completed

      - name: Remove temporary workflow
        run: |
          git fetch origin master
          git switch master
          git pull --ff-only origin master
          rm .github/workflows/rebuild-shared-upper-base.yml
          git add .github/workflows/rebuild-shared-upper-base.yml
          git commit -m "chore: remove temporary upper base workflow"
          git push origin master
