name: Patch window plant on feature

on:
  push:
    paths:
      - .github/workflows/patch-window-plant-feature.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature
        uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - name: Furnish window area
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/landing/components/StudioScene.tsx")
          text = path.read_text()
          old = '''      <Window onOpen={onOpenWindow} />
      <Plant position={[-1.42, 0.84, -2.72]} scale={0.78} />'''
          new = '''      <Window onOpen={onOpenWindow} />
      <Plant position={[-2.9, 0.47, 2.42]} scale={1.05} />
      <Plant position={[-1.42, 0.84, -2.72]} scale={0.78} />'''

          if old not in text:
              raise SystemExit("window furniture target not found")

          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/landing/components/StudioScene.tsx
          git commit -m "Furnish window plant area"
          git push origin HEAD:feature
