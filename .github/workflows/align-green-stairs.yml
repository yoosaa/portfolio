name: Align green stairs

on:
  push:
    branches:
      - feature
    paths:
      - .github/workflows/align-green-stairs.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Align green stairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/landing/components/StudioScene.tsx")
          text = path.read_text()
          old = "<MiniStairs position={[-0.8, 0, -1.14]} />"
          new = "<MiniStairs position={[-1.61, 0, -1.14]} />"

          if old not in text:
              raise SystemExit("green stairs position was not found")

          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/align-green-stairs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/landing/components/StudioScene.tsx .github/workflows/align-green-stairs.yml
          git commit -m "Align green platform stairs"
          git push origin HEAD:feature
