name: Reposition beige connector

on:
  push:
    branches:
      - feature
    paths:
      - .github/workflows/reposition-beige-connector.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Reposition beige connector floor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/landing/components/StudioScene.tsx")
          text = path.read_text()
          old = '''      <SolidBox
        position={[-0.95, -0.01, -0.35]}
        scale={[1.55, 0.1, 1.5]}
        color="#dfc9a8"
      />'''
          new = '''      <SolidBox
        position={[-0.35, -0.01, -0.55]}
        scale={[1.3, 0.1, 1]}
        color="#dfc9a8"
      />'''

          if old not in text:
              raise SystemExit("beige connector floor was not found")

          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/reposition-beige-connector.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/landing/components/StudioScene.tsx .github/workflows/reposition-beige-connector.yml
          git commit -m "Reposition beige connector floor"
          git push origin HEAD:feature
