name: Reset green stair offset

on:
  push:
    branches:
      - feature
    paths:
      - .github/workflows/reset-green-stair-offset.yml

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Reset green stair offset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/landing/components/StudioScene.tsx")
          text = path.read_text()
          old = '<MiniStairs position={[-1.61, 0, -1.14]} bottomStepOffsetX={0.22} />'
          new = '<MiniStairs position={[-1.61, 0, -1.14]} />'

          if old not in text:
              raise SystemExit("green stair offset call was not found")

          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/reset-green-stair-offset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/landing/components/StudioScene.tsx .github/workflows/reset-green-stair-offset.yml
          git commit -m "Reset green stair step alignment"
          git push origin HEAD:feature
