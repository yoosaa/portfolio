name: Align green bottom step

on:
  push:
    branches:
      - feature
    paths:
      - .github/workflows/align-green-bottom-step.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature
        uses: actions/checkout@v4
        with:
          ref: feature

      - name: Align green bottom step
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/landing/components/StudioScene.tsx")
          text = path.read_text()

          text = text.replace(
              "function MiniStairs({\n  position,\n  rotation = [0, 0, 0],\n}: {\n  position: [number, number, number];\n  rotation?: [number, number, number];\n}) {",
              "function MiniStairs({\n  position,\n  rotation = [0, 0, 0],\n  bottomStepOffsetX = 0,\n}: {\n  position: [number, number, number];\n  rotation?: [number, number, number];\n  bottomStepOffsetX?: number;\n}) {",
              1,
          )
          text = text.replace(
              "{ position: [0, 0.075, 0.54], scale: [1.18, 0.15, 0.48] },",
              "{ position: [bottomStepOffsetX, 0.075, 0.54], scale: [1.18, 0.15, 0.48] },",
              1,
          )
          text = text.replace(
              '<MiniStairs position={[-1.61, 0, -1.14]} />',
              '<MiniStairs position={[-1.61, 0, -1.14]} bottomStepOffsetX={0.22} />',
              1,
          )

          path.write_text(text)
          PY

          rm .github/workflows/align-green-bottom-step.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/landing/components/StudioScene.tsx .github/workflows/align-green-bottom-step.yml
          git commit -m "Align green stair bottom step"
          git push origin HEAD:feature
